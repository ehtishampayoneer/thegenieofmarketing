name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20. @supabase/supabase-js 2.110 needs the WebSocket that Node
          # only ships from 22, and throws when a client is built without it. The
          # app runs on 22+ in production (on 20 every page would fail), so CI on
          # 20 was testing a runtime nothing uses — and has failed every push since
          # test/no-stale-reads.test.js began building real clients on 27 Sep.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Build doesn't connect to Supabase; placeholders keep prerender happy.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
