# The swarm's heartbeat. This asks Genie to run one pass of the testers and
# improvers (app/api/swarm/tick), so drafts are tested during the day and not only
# at night, and work left over when the free AI was busy is picked up as soon as it
# is back. Free: GitHub Actions minutes are free on public repos.
#
# WHAT THE SCHEDULE BELOW ACTUALLY DELIVERS. It asks for every ten minutes. GitHub
# does not honour that on free shared runners — measured over the first six days of
# this workflow, it fired 39 times: about seven a day, a median of three and a half
# hours apart, and never closer together than 107 minutes. So read `*/10` as "as
# often as GitHub feels like", which in practice is a few times a day.
#
# That is still worth having — it is the difference between a draft written at noon
# being improved this afternoon and waiting for 1am. But if the gap ever matters,
# the fix is not this file: point a free external pinger (cron-job.org, Cloudflare
# Workers cron) at the same URL with the same Authorization header. Vercel's own
# cron is no help — Hobby allows one run a day.
#
# Setup, once: repo Settings -> Secrets and variables -> Actions
#   Secret   HEARTBEAT_SECRET = the same value as HEARTBEAT_SECRET in Vercel
#            (its own secret: never reuse CRON_SECRET, which also signs links)
#   Variable GENIE_URL    = https://thegenieofmarketing.vercel.app
#
# This repo is public, so the log shows only the HTTP status, never any data.

name: Genie heartbeat

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: genie-heartbeat
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Run one swarm pass
        env:
          HEARTBEAT_SECRET: ${{ secrets.HEARTBEAT_SECRET }}
          GENIE_URL: ${{ vars.GENIE_URL }}
        run: |
          if [ -z "$HEARTBEAT_SECRET" ] || [ -z "$GENIE_URL" ]; then
            echo "Heartbeat not set up yet (add HEARTBEAT_SECRET and GENIE_URL). Skipping."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 295 -X POST "$GENIE_URL/api/swarm/tick" \
            -H "Authorization: Bearer $HEARTBEAT_SECRET" -H "Content-Type: application/json" -d '{}' || echo "000")
          echo "Genie answered $code"
          # A timeout still means the pass ran; only a refusal is worth failing on.
          if [ "$code" = "401" ]; then echo "HEARTBEAT_SECRET does not match Vercel's (or Vercel was not redeployed after adding it)."; exit 1; fi
